  <main role="main" class="inner cover">


    <div class="container">
      <div class="row">

        <div class="col-xl-12">
          <h3 class="cover-heading">En esta sección podrás conocer cuál es el tipo de vidriado adecuado para tu caso. Por favor <strong>seleccioná tus principales necesidades</strong>.</h1>
        </div>

        <div class="botonera col-xl-12">        
           <div class="col-lg-5a mt-3 fadeIn">
            <a seleccion="accidentes">
              <img class="img-button img-fluid" animation-delay-cero src="images/icons/necesidades_evitar_accidentes.gif" />
            </a>
          </div>
          <div class="col-lg-5a mt-3 fadeIn">
            <a seleccion="robo">
              <img class="img-button img-fluid" animation-delay-uno src="images/icons/necesidades_antirobo.gif" />
            </a>
          </div>
          <div class="col-lg-5a mt-3 fadeIn">
            <a seleccion="ruidos">
              <img class="img-button img-fluid" animation-delay-dos src="images/icons/necesidades_aislar_ruidos.gif" />
            </a>
          </div>
          <div class="col-lg-5a mt-3 fadeIn">
            <a seleccion="energia">
              <img class="img-button img-fluid" animation-delay-tres src="images/icons/necesidades_ahorrar_energia.gif" />
            </a>
          </div>
          <div class="col-lg-5a mt-3 fadeIn">
            <a seleccion="solar">
              <img class="img-button img-fluid" animation-delay-cuatro src="images/icons/necesidades_proteccion_solar.gif" />
            </a>
          </div>
        </div>

      </div> 

      <p id="demo"></p>

      <div class="row div_continuar">
        <div class="col-lg-12" style="margin: 0px; padding: 0px; height: 0px;">
          <p style="display: none;" class="continuar">Podés seleccionar más necesidades o continuar.</p>
        </div>
        <div class="col-lg-12">
          <button style="display: none;" id="continuar" class="btn btn-lg btn-secondary continuar">Continuar</button> 
        </div>
      </div>
